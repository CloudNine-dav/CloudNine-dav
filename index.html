<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CloudNine | Davi Soares</title>
<meta name="description" content="Davi Soares, desenvolvedor Java em formação. CloudNine.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cyan:#5CE1E6;--pink:#FF4FD0;--ink:#E6ECFF;--muted:#9AA6C8}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#05030f;color:var(--ink);overflow:hidden}
body{font-family:"JetBrains Mono",ui-monospace,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:fixed;left:0;right:0;bottom:12%;text-align:center;padding:0 24px;
  opacity:0;transform:translateY(12px);transition:opacity 1.2s,transform 1.2s}
main.show{opacity:1;transform:none}
h1{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(20px,4.5vw,34px);letter-spacing:.02em}
p{margin-top:.6em;color:var(--muted);font-size:clamp(13px,2.6vw,16px)}
a{display:inline-block;margin-top:1.4em;color:var(--cyan);text-decoration:none;border:1px solid rgba(92,225,230,.5);
  padding:.7em 1.3em;border-radius:10px;font-size:14px;background:rgba(5,3,15,.6);transition:background .2s,box-shadow .2s}
a:hover,a:focus-visible{background:rgba(92,225,230,.12);box-shadow:0 0 18px rgba(92,225,230,.35);outline:none}
@media (prefers-reduced-motion:reduce){main{transition:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="logo"></canvas>
<main id="info">
  <h1>Davi Soares</h1>
  <p>Desenvolvedor Java em formação, de Crateús (CE)</p>
  <a href="https://github.com/CloudNine-dav">Ver projetos no GitHub</a>
</main>
<script>
const rc=document.getElementById('rain'),rx=rc.getContext('2d');
const lc=document.getElementById('logo'),lx=lc.getContext('2d');
let W,H,DPR,drops=[],spl=[],parts=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function size(cv,cx){cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
function newDrop(any){return{x:rnd(-40,W+40),y:any?rnd(-H,H):rnd(-200,-10),v:rnd(700,1100),l:rnd(14,30),c:Math.random()<.5?'92,225,230':'255,80,200'};}

function buildLogo(){
  const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
  const base=Math.min(W,H*.75,760),cx=W/2,cy=H*.33,u=base*.11;
  x.fillStyle='#fff';
  [[-1.1,.3,.75],[-.3,-.3,1],[.7,-.05,.85],[1.4,.4,.6]].forEach(([a,b,r])=>{x.beginPath();x.arc(cx+a*u,cy+b*u,r*u,0,6.28);x.fill();});
  x.fillRect(cx-1.8*u,cy+.3*u,3.8*u,.75*u);
  x.globalCompositeOperation='destination-out';
  x.font=`900 ${u*1.15}px Orbitron, sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('9',cx+.05*u,cy+.15*u);
  x.globalCompositeOperation='source-over';
  x.font=`900 ${base*.12}px Orbitron, sans-serif`;x.fillText('CloudNine',cx,cy+u*2.3);
  const d=x.getImageData(0,0,W,H).data,step=Math.max(3,Math.round(base/140)),pts=[];
  for(let yy=0;yy<H;yy+=step)for(let xx=0;xx<W;xx+=step)if(d[(yy*W+xx)*4+3]>128)pts.push([xx,yy]);
  parts=pts.map(([tx,ty])=>({tx,ty,x:rnd(0,W),y:rnd(0,H),vx:0,vy:0,h:ty<cy+u*1.3?185+rnd(-10,10):300+rnd(-20,20)}));
}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;size(rc,rx);size(lc,lx);
  drops=[];const n=Math.round(W*H/2600);for(let i=0;i<n;i++)drops.push(newDrop(true));buildLogo();}
resize();addEventListener('resize',resize);
document.fonts&&document.fonts.ready.then(buildLogo);
setTimeout(()=>document.getElementById('info').classList.add('show'),3500);

function drawRain(t,dt){
  const g=rx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05030f');g.addColorStop(.85,'#120a24');g.addColorStop(1,'#1a0d2e');
  rx.globalCompositeOperation='source-over';rx.fillStyle=g;rx.fillRect(0,0,W,H);
  const fy=H*.9;rx.globalCompositeOperation='lighter';
  rx.fillStyle='rgba(92,225,230,.35)';rx.fillRect(0,fy,W,1.5);
  rx.lineWidth=1.2;
  for(const d of drops){d.y+=d.v*dt;d.x-=d.v*dt*.08;
    rx.strokeStyle=`rgba(${d.c},.45)`;rx.beginPath();rx.moveTo(d.x,d.y);rx.lineTo(d.x+d.l*.08,d.y-d.l);rx.stroke();
    if(d.y>fy+rnd(0,H-fy)){spl.push({x:d.x,y:d.y,r:1,c:d.c,a:.8});Object.assign(d,newDrop(false));}}
  for(let i=spl.length-1;i>=0;i--){const s=spl[i];s.r+=dt*40;s.a-=dt*1.6;if(s.a<=0){spl.splice(i,1);continue;}
    rx.strokeStyle=`rgba(${s.c},${s.a})`;rx.beginPath();rx.ellipse(s.x,s.y,s.r,s.r*.25,0,0,6.28);rx.stroke();}
}
let lt=0;
function drawLogo(t,dt){
  lt+=dt;const ph=lt%10;
  lx.globalCompositeOperation='destination-out';lx.fillStyle='rgba(0,0,0,.3)';lx.fillRect(0,0,W,H);
  lx.globalCompositeOperation='lighter';
  const flick=Math.random()<.03?.3:1;
  for(const p of parts){
    if(ph<7.5){p.vx+=(p.tx-p.x)*dt*6;p.vy+=(p.ty-p.y)*dt*6;p.vx*=.86;p.vy*=.86;}
    else if(ph<7.6){const a=rnd(0,6.28),v=rnd(3,12);p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v;}
    else{p.vx*=.985;p.vy*=.985;}
    p.x+=p.vx;p.y+=p.vy;
    lx.fillStyle=`hsla(${p.h},95%,65%,${.9*flick})`;lx.fillRect(p.x,p.y,1.8,1.8);}
}
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;drawRain(now/1000,dt);drawLogo(now/1000,dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
